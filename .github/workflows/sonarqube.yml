name: SonarQube

on:
  push:
    branches:
      - Ahmad
  pull_request:
    branches:
      - Ahmad

jobs:
  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      ADMIN_JWT_SECRET: ci-admin-jwt-secret
      ADMIN_JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma schemas
        working-directory: backend
        run: |
          npm run prisma:master:validate
          npm run prisma:tenant:validate

      - name: Generate Prisma clients
        working-directory: backend
        run: |
          npm run prisma:master:generate
          npm run prisma:tenant:generate

      - name: Test backend with coverage
        working-directory: backend
        run: npm run test:cov

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


